appId: com.opencode.desktop
productName: OpenCode Desktop
copyright: Copyright © 2026 OpenCode Desktop contributors

directories:
  # Optional icons / installer assets live here (build/icon.ico). Absent is fine.
  buildResources: build
  output: dist

# Positive patterns replace the default "**/*" for ordinary files.
# Production dependencies under node_modules (i.e. @opencode-ai/sdk, which the
# main process loads at runtime) are collected separately by electron-builder
# and are NOT affected by these patterns — only "!" patterns can exclude them.
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

asarUnpack:
  - resources/**
  - "**/node_modules/node-pty/**"

# node-pty ships N-API prebuilds (prebuilds/win32-x64) that load ABI-stably in
# Electron — rebuilding from source needs Spectre-mitigated VS libs and is unnecessary.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  executableName: opencode-desktop
  # No spaces: GitHub rewrites spaces in uploaded asset names, and electron-updater
  # resolves the hyphenated name electron-builder writes into latest.yml.
  artifactName: OpenCode-Desktop-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  artifactName: OpenCode-Desktop-${version}-setup.${ext}

portable:
  artifactName: OpenCode-Desktop-${version}-portable.${ext}

publish:
  provider: github
  owner: Boss720
  repo: Open-Sauce-Coder
